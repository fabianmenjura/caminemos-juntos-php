<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en el Pago - Adopta un Abuelo Colombia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        
        .error-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            color: white;
            animation: shake 0.8s ease-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card shadow-lg">
                        <div class="card-body p-5 text-center">
                            <div class="error-icon">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            
                            <h1 class="mb-4">Error en el Pago</h1>
                            
                            <p class="lead">
                                Lo sentimos, hubo un problema al procesar tu donación. 
                                No te preocupes, no se ha realizado ningún cargo.
                            </p>

                            <div id="error-reason" class="alert alert-warning my-4"></div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                <a href="../donar.html" class="btn btn-primary btn-lg">
                                    <i class="fas fa-redo me-2"></i> Intentar Nuevamente
                                </a>
                                <a href="../index.html" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-home me-2"></i> Volver al Inicio
                                </a>
                            </div>

                            <div class="mt-4">
                                <p class="text-muted">
                                    <i class="fas fa-phone me-2"></i> ¿Necesitas ayuda? Llámanos: +57 (1) 234-5678
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Obtener razón del error de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        
        const errorMessages = {
            'DECLINED': 'La transacción fue rechazada por el banco',
            'EXPIRED': 'El tiempo para completar el pago expiró',
            'CANCELLED': 'La transacción fue cancelada',
            'invalid_signature': 'Error de seguridad en la transacción',
            'server_error': 'Error temporal del servidor'
        };
        
        const message = errorMessages[reason] || 'Error inesperado en el proceso de pago';
        document.getElementById('error-reason').innerHTML = `
            <i class="fas fa-info-circle me-2"></i> ${message}
        `;
    </script>
</body>
</html>
