<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Nuevas Funcionalidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">🧪 Prueba de Nuevas Funcionalidades</h1>
        
        <div class="row">
            <!-- Test Testimonios -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5>⭐ Test Testimonios</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testTestimonios()">
                            Cargar Testimonios
                        </button>
                        <div id="testimonios-result" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Test Voluntarios -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5>🙋 Test Voluntarios</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success" onclick="testVoluntarios()">
                            Enviar Voluntario de Prueba
                        </button>
                        <div id="voluntarios-result" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Test Abuelos -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5>👴 Test Abuelos</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-info" onclick="testAbuelos()">
                            Cargar Abuelos
                        </button>
                        <div id="abuelos-result" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Test API Genérica -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5>🔧 Test API Genérica</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-warning" onclick="testAPIGenerica()">
                            Probar api.get()
                        </button>
                        <div id="api-result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        async function testTestimonios() {
            const result = document.getElementById('testimonios-result');
            result.innerHTML = '<div class="spinner-border"></div> Cargando...';
            
            try {
                const response = await api.get('testimonios');
                
                if (response.success) {
                    result.innerHTML = `
                        <div class="alert alert-success">
                            ✅ <strong>Éxito!</strong><br>
                            Testimonios cargados: ${response.data.testimonios.length}<br>
                            <small>${JSON.stringify(response.data.testimonios[0] || {}, null, 2)}</small>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="alert alert-danger">❌ Error: ${response.message}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
            }
        }

        async function testVoluntarios() {
            const result = document.getElementById('voluntarios-result');
            result.innerHTML = '<div class="spinner-border"></div> Enviando...';
            
            const dataPrueba = {
                nombre_completo: 'Juan Prueba',
                email: 'juan.prueba@test.com',
                telefono: '3001234567',
                ciudad: 'Bogotá',
                tipo_voluntariado: 'voluntario',
                habilidades: 'Prueba de funcionalidad'
            };
            
            try {
                const response = await api.post('voluntarios', dataPrueba);
                
                if (response.success) {
                    result.innerHTML = `
                        <div class="alert alert-success">
                            ✅ <strong>Éxito!</strong><br>
                            ${response.message}<br>
                            ID creado: ${response.data.id}
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="alert alert-danger">❌ Error: ${response.message}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
            }
        }

        async function testAbuelos() {
            const result = document.getElementById('abuelos-result');
            result.innerHTML = '<div class="spinner-border"></div> Cargando...';
            
            try {
                const response = await api.getAbuelos();
                
                if (response.success) {
                    result.innerHTML = `
                        <div class="alert alert-success">
                            ✅ <strong>Éxito!</strong><br>
                            Abuelos cargados: ${response.data.abuelos.length}<br>
                            Total: ${response.data.total}
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="alert alert-danger">❌ Error: ${response.message}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
            }
        }

        async function testAPIGenerica() {
            const result = document.getElementById('api-result');
            result.innerHTML = '<div class="spinner-border"></div> Probando...';
            
            try {
                // Probar que el método api.get existe
                if (typeof api.get === 'function') {
                    const response = await api.get('abuelos', { limit: 1 });
                    
                    result.innerHTML = `
                        <div class="alert alert-success">
                            ✅ <strong>api.get() funciona!</strong><br>
                            Métodos disponibles:
                            <ul>
                                <li>api.get() ✅</li>
                                <li>api.post() ${typeof api.post === 'function' ? '✅' : '❌'}</li>
                                <li>api.put() ${typeof api.put === 'function' ? '✅' : '❌'}</li>
                                <li>api.delete() ${typeof api.delete === 'function' ? '✅' : '❌'}</li>
                            </ul>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div class="alert alert-danger">❌ api.get() NO existe</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
            }
        }

        // Auto-test al cargar
        console.log('🧪 Página de pruebas cargada');
        console.log('API Base URL:', api.baseURL);
        console.log('Métodos disponibles:', {
            get: typeof api.get,
            post: typeof api.post,
            put: typeof api.put,
            delete: typeof api.delete
        });
    </script>
</body>
</html>
