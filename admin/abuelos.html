<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/placeholder-logo.png">
    <link rel="shortcut icon" type="image/png" href="../assets/images/placeholder-logo.png">
    
    <title>Gestión de Abuelos - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
    
    <!-- Main -->
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-users me-2"></i>Gestión de Abuelos</h1>
            <button class="btn btn-primary" onclick="showCreateModal()">
                <i class="fas fa-plus me-2"></i>Nuevo Abuelo
            </button>
        </div>
        
        <div class="content-wrapper">
            <!-- Filtros y Búsqueda -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Buscar</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="buscarAbuelo" 
                                       placeholder="Buscar por nombre, ciudad o historia..." 
                                       onkeyup="filtrarAbuelos()">
                                <button class="btn btn-outline-secondary" onclick="limpiarBusqueda()">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" id="filtroEstado" onchange="filtrarAbuelos()">
                                <option value="">Todos</option>
                                <option value="disponible" selected>Disponibles</option>
                                <option value="adoptado">Adoptados</option>
                                <option value="inactivo">Inactivos</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Género</label>
                            <select class="form-select" id="filtroGenero" onchange="filtrarAbuelos()">
                                <option value="">Todos</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Tabla -->
            <div class="table-card">
                <div id="loading" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
                
                <div class="table-responsive" id="tabla" style="display: none;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Edad</th>
                                <th>Ciudad</th>
                                <th>Género</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="abueloModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Abuelo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="abueloForm">
                        <input type="hidden" id="abueloId">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Nombre Completo *</label>
                                <input type="text" class="form-control" id="nombre" required placeholder="Ej: María González">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ciudad *</label>
                                <input type="text" class="form-control" id="ciudad" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Género *</label>
                                <select class="form-select" id="genero" required>
                                    <option value="M">Masculino</option>
                                    <option value="F">Femenino</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Estado *</label>
                                <select class="form-select" id="estado" required>
                                    <option value="disponible">Disponible</option>
                                    <option value="adoptado">Adoptado</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha de Nacimiento *</label>
                                <input type="date" class="form-control" id="fecha_nacimiento" required>
                                <small class="text-muted">
                                    <i class="fas fa-info-circle me-1"></i>La edad se calcula automáticamente
                                </small>
                            </div>
                            <div class="col-12">
                                <label class="form-label">
                                    <i class="fas fa-image me-2"></i>Foto del Abuelo
                                </label>
                                
                                <!-- Preview de la imagen -->
                                <div class="mb-3">
                                    <img id="imagePreview" src="../assets/images/placeholder.jpg" 
                                         class="rounded" style="max-width: 200px; max-height: 200px; display: block;" alt="Preview">
                                </div>
                                
                                <!-- Input de archivo -->
                                <div class="input-group mb-2">
                                    <input type="file" class="form-control" id="imageFile" accept="image/*" onchange="previewImage(this)">
                                    <button class="btn btn-outline-primary" type="button" onclick="uploadImage()">
                                        <i class="fas fa-upload me-1"></i>Subir
                                    </button>
                                </div>
                                
                                <!-- URL manual (hidden por defecto) -->
                                <div class="collapse" id="manualUrlDiv">
                                    <input type="text" class="form-control" id="foto_url" placeholder="assets/images/abuelo-x.jpg" readonly>
                                </div>
                                
                                <small class="text-muted">
                                    <i class="fas fa-info-circle me-1"></i>
                                    La imagen se optimizará automáticamente (max 800x800px, ~100KB)
                                </small>
                                
                                <div id="uploadProgress" class="mt-2" style="display: none;">
                                    <div class="progress">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%">
                                            Subiendo y optimizando...
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label">Descripción *</label>
                                <textarea class="form-control" id="descripcion" rows="4" required></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveAbuelo()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/admin-components.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        let modal;
        let todosLosAbuelos = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            await initAdminComponents('abuelos');
            modal = new bootstrap.Modal(document.getElementById('abueloModal'));
            loadAbuelos();
        });
        
        async function loadAbuelos() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('tabla').style.display = 'none';
                
                const response = await adminAPI.get('admin/abuelos');
                
                if (response.success) {
                    todosLosAbuelos = response.data.abuelos;
                    filtrarAbuelos();
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error al Cargar',
                    text: 'No se pudieron cargar los abuelos.',
                    confirmButtonColor: '#eaa33a'
                });
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filtrarAbuelos() {
            const inputBuscar = document.getElementById('buscarAbuelo');
            const selectEstado = document.getElementById('filtroEstado');
            const selectGenero = document.getElementById('filtroGenero');
            
            if (!inputBuscar || !selectEstado || !selectGenero) return;
            
            const busqueda = inputBuscar.value.toLowerCase();
            const filtroEstado = selectEstado.value;
            const filtroGenero = selectGenero.value;
            
            let filtrados = todosLosAbuelos;
            
            // Filtrar por búsqueda
            if (busqueda) {
                filtrados = filtrados.filter(a => {
                    const nombre = (a.nombre_completo || a.nombre || '').toLowerCase();
                    const ciudad = (a.ciudad || '').toLowerCase();
                    const historia = (a.historia || '').toLowerCase();
                    return nombre.includes(busqueda) || ciudad.includes(busqueda) || historia.includes(busqueda);
                });
            }
            
            // Filtrar por estado
            if (filtroEstado) {
                filtrados = filtrados.filter(a => a.estado === filtroEstado);
            }
            
            // Filtrar por género
            if (filtroGenero) {
                filtrados = filtrados.filter(a => a.genero === filtroGenero);
            }
            
            renderAbuelos(filtrados);
            
            // Mostrar mensaje si no hay resultados
            if (filtrados.length === 0) {
                const tbody = document.getElementById('tbody');
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-search fa-2x mb-2 d-block"></i>No se encontraron abuelos con los filtros seleccionados</td></tr>';
                }
            }
        }

        function limpiarBusqueda() {
            const input = document.getElementById('buscarAbuelo');
            if (input) input.value = '';
            filtrarAbuelos();
        }
        
        function renderAbuelos(abuelos) {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = abuelos.map(a => `
                <tr>
                    <td><strong>#${a.id}</strong></td>
                    <td>
                        <img src="../${a.foto_url}" width="40" height="40" class="rounded-circle me-2" 
                             onerror="this.src='../assets/images/placeholder.jpg'">
                        ${a.nombre}
                    </td>
                    <td>${a.edad}</td>
                    <td>${a.ciudad}</td>
                    <td><i class="fas fa-${a.genero === 'M' ? 'male' : 'female'}"></i> ${a.genero === 'M' ? 'M' : 'F'}</td>
                    <td>
                        <span class="badge badge-${a.estado === 'disponible' ? 'success' : (a.estado === 'adoptado' ? 'info' : 'secondary')}">
                            ${a.estado}
                        </span>
                    </td>
                    <td>
                        <button class="btn action-btn-edit" onclick="editAbuelo(${a.id})"><i class="fas fa-edit"></i></button>
                        ${a.estado !== 'inactivo' ? 
                            `<button class="btn action-btn-delete" onclick="deleteAbuelo(${a.id}, '${a.nombre}')"><i class="fas fa-trash"></i></button>` 
                            : ''}
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tabla').style.display = 'block';
        }
        
        function showCreateModal() {
            document.getElementById('abueloForm').reset();
            document.getElementById('abueloId').value = '';
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus me-2"></i>Nuevo Abuelo';
            modal.show();
        }
        
        async function editAbuelo(id) {
            try {
                const response = await adminAPI.getAbuelos({ limite: 1000 });
                const abuelo = response.data.abuelos.find(a => a.id == id);
                
                if (!abuelo) {
                    Swal.fire('No Encontrado', 'El abuelo no fue encontrado', 'error');
                    return;
                }
                
                document.getElementById('abueloId').value = abuelo.id;
                document.getElementById('nombre').value = abuelo.nombre;
                document.getElementById('ciudad').value = abuelo.ciudad;
                document.getElementById('genero').value = abuelo.genero || 'M';
                document.getElementById('estado').value = abuelo.estado;
                document.getElementById('descripcion').value = abuelo.descripcion || '';
                document.getElementById('foto_url').value = abuelo.foto_url || '';
                document.getElementById('fecha_nacimiento').value = abuelo.fecha_nacimiento || '';
                
                // Cargar preview de la imagen existente
                if (abuelo.foto_url) {
                    document.getElementById('imagePreview').src = '../' + abuelo.foto_url;
                }
                
                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit me-2"></i>Editar Abuelo';
                modal.show();
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function saveAbuelo() {
            const id = document.getElementById('abueloId').value;
            const data = {
                nombre: document.getElementById('nombre').value,
                ciudad: document.getElementById('ciudad').value,
                genero: document.getElementById('genero').value,
                estado: document.getElementById('estado').value,
                descripcion: document.getElementById('descripcion').value,
                foto_url: document.getElementById('foto_url').value || 'assets/images/placeholder.jpg',
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value || null
            };
            
            try {
                let response;
                if (id) {
                    response = await adminAPI.updateAbuelo(id, data);
                } else {
                    response = await adminAPI.createAbuelo(data);
                }
                
                if (response.success) {
                    modal.hide();
                    Swal.fire({
                        icon: 'success',
                        title: '¡Guardado!',
                        text: response.message || 'Abuelo guardado exitosamente',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    loadAbuelos();
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error al Guardar',
                    text: 'No se pudo guardar el abuelo. Verifica los datos.',
                    confirmButtonColor: '#2c5f2d'
                });
            }
        }
        
        async function deleteAbuelo(id, nombre) {
            const result = await Swal.fire({
                title: '¿Eliminar Abuelo?',
                text: `¿Estás seguro de eliminar a ${nombre}? Esta acción marcará el registro como eliminado.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d'
            });
            
            if (!result.isConfirmed) return;
            
            try {
                const response = await adminAPI.deleteAbuelo(id);
                if (response.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Eliminado',
                        text: response.message || 'Abuelo eliminado',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    loadAbuelos();
                }
            } catch (error) {
                Swal.fire('Error', 'No se pudo eliminar el abuelo', 'error');
            }
        }
        
        // Preview de imagen antes de subir
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                };
                
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        // Subir imagen al servidor
        async function uploadImage() {
            const fileInput = document.getElementById('imageFile');
            
            if (!fileInput.files || !fileInput.files[0]) {
                Swal.fire('Selecciona una Imagen', 'Por favor selecciona una imagen primero', 'warning');
                return;
            }
            
            const file = fileInput.files[0];
            
            // Validar tamaño (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                Swal.fire('Archivo Muy Grande', 'La imagen no puede superar 5MB', 'warning');
                return;
            }
            
            // Validar tipo
            if (!file.type.startsWith('image/')) {
                Swal.fire('Archivo Inválido', 'El archivo debe ser una imagen', 'warning');
                return;
            }
            
            try {
                // Mostrar progreso
                document.getElementById('uploadProgress').style.display = 'block';
                
                Swal.fire({
                    title: 'Subiendo Imagen',
                    text: 'Optimizando y guardando...',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
                
                // Subir imagen
                const response = await adminAPI.uploadImage(file);
                
                Swal.close();
                
                if (response.success) {
                    // Actualizar el campo foto_url
                    document.getElementById('foto_url').value = response.data.url;
                    
                    // Actualizar preview con la imagen subida
                    document.getElementById('imagePreview').src = '../' + response.data.url;
                    
                    // Mostrar éxito
                    const sizeKB = Math.round(response.data.size / 1024);
                    Swal.fire({
                        icon: 'success',
                        title: '¡Imagen Subida!',
                        html: `Tamaño optimizado: <strong>${sizeKB}KB</strong><br>Ruta: ${response.data.url}`,
                        timer: 3000,
                        showConfirmButton: false
                    });
                    
                    // Limpiar input de archivo
                    fileInput.value = '';
                } else {
                    Swal.fire('Error', response.message || 'Error al subir imagen', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudo subir la imagen: ' + error.message, 'error');
            } finally {
                document.getElementById('uploadProgress').style.display = 'none';
            }
        }
        
        async function logout() {
            const result = await Swal.fire({
                title: '¿Cerrar Sesión?',
                text: '¿Estás seguro de que quieres salir?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#2c5f2d'
            });
            
            if (result.isConfirmed) {
                await adminAuth.logout();
            }
        }
    </script>
</body>
</html>
