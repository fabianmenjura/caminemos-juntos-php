<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Abuelos - Panel Administrativo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-heart fa-2x mb-2" style="color: var(--color-accent);"></i>
            <h3>Adopta un Abuelo</h3>
            <p>Panel de Administración</p>
        </div>
        
        <div class="sidebar-menu">
            <div class="menu-section">
                <div class="menu-section-title">Principal</div>
                <a href="dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </div>
            
            <div class="menu-section">
                <div class="menu-section-title">Gestión</div>
                <a href="abuelos.html" class="menu-item active">
                    <i class="fas fa-users"></i>
                    <span>Abuelos</span>
                </a>
                <a href="donaciones.html" class="menu-item">
                    <i class="fas fa-hand-holding-heart"></i>
                    <span>Donaciones</span>
                </a>
                <a href="mensajes.html" class="menu-item">
                    <i class="fas fa-envelope"></i>
                    <span>Mensajes</span>
                </a>
            </div>
            
            <div class="menu-section">
                <div class="menu-section-title">Sistema</div>
                <a href="logs.html" class="menu-item">
                    <i class="fas fa-history"></i>
                    <span>Logs de Actividad</span>
                </a>
                <a href="configuracion.html" class="menu-item">
                    <i class="fas fa-cog"></i>
                    <span>Configuración</span>
                </a>
            </div>
        </div>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <h5 id="userName">Usuario</h5>
                    <p id="userRole">Rol</p>
                </div>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <div class="topbar">
            <h1><i class="fas fa-users me-2"></i>Gestión de Abuelos</h1>
            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="showCreateModal()">
                    <i class="fas fa-plus me-2"></i>Nuevo Abuelo
                </button>
            </div>
        </div>
        
        <!-- Content -->
        <div class="content-wrapper">
            <!-- Filtros -->
            <div class="table-card mb-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Estado</label>
                        <select class="form-select" id="filtroEstado" onchange="loadAbuelos()">
                            <option value="">Todos</option>
                            <option value="disponible" selected>Disponibles</option>
                            <option value="adoptado">Adoptados</option>
                            <option value="eliminado">Eliminados</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Género</label>
                        <select class="form-select" id="filtroGenero" onchange="loadAbuelos()">
                            <option value="">Todos</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Buscar</label>
                        <input type="text" class="form-control" id="buscarAbuelo" placeholder="Buscar por nombre o ciudad..." onkeyup="buscarAbuelos()">
                    </div>
                </div>
            </div>
            
            <!-- Tabla de Abuelos -->
            <div class="table-card">
                <div id="loadingAbuelos" class="loading-spinner">
                    <div class="spinner-border text-primary"></div>
                </div>
                
                <div class="table-responsive" id="tablaAbuelos" style="display: none;">
                    <table class="table custom-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Edad</th>
                                <th>Ciudad</th>
                                <th>Género</th>
                                <th>Estado</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="abuelosBody">
                        </tbody>
                    </table>
                </div>
                
                <!-- Paginación -->
                <nav id="paginacion" style="display: none;">
                    <ul class="pagination" id="paginationList">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Abuelo -->
    <div class="modal fade" id="abueloModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="fas fa-user-plus me-2"></i>Nuevo Abuelo
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="abueloForm">
                        <input type="hidden" id="abueloId">
                        
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Nombre Completo *</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Edad *</label>
                                <input type="number" class="form-control" id="edad" min="60" max="120" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ciudad *</label>
                                <input type="text" class="form-control" id="ciudad" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Género *</label>
                                <select class="form-select" id="genero" required>
                                    <option value="M">Masculino</option>
                                    <option value="F">Femenino</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Estado *</label>
                                <select class="form-select" id="estado" required>
                                    <option value="disponible">Disponible</option>
                                    <option value="adoptado">Adoptado</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fecha_nacimiento">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Foto URL</label>
                                <input type="text" class="form-control" id="foto_url" placeholder="assets/images/abuelo-x.jpg">
                                <small class="text-muted">Ruta relativa de la imagen</small>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Descripción *</label>
                                <textarea class="form-control" id="descripcion" rows="4" required placeholder="Escribe una descripción del abuelo (mínimo 20 caracteres)..."></textarea>
                                <small class="text-muted"><span id="charCount">0</span> caracteres</small>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveAbuelo()">
                        <i class="fas fa-save me-2"></i>Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    
    <script>
        let currentPage = 1;
        let currentFilters = {};
        let abueloModal;
        
        // Inicializar
        (async function() {
            const isAuth = await adminAuth.requireAuth();
            if (!isAuth) return;
            
            if (adminAuth.user) {
                document.getElementById('userName').textContent = adminAuth.user.nombre_completo;
                document.getElementById('userRole').textContent = getRoleLabel(adminAuth.user.rol);
            }
            
            abueloModal = new bootstrap.Modal(document.getElementById('abueloModal'));
            
            // Contador de caracteres
            document.getElementById('descripcion').addEventListener('input', function() {
                document.getElementById('charCount').textContent = this.value.length;
            });
            
            loadAbuelos();
        })();
        
        // Cargar abuelos
        async function loadAbuelos(page = 1) {
            currentPage = page;
            
            const params = {
                pagina: page,
                limite: 20
            };
            
            const estado = document.getElementById('filtroEstado').value;
            if (estado) params.estado = estado;
            
            try {
                document.getElementById('loadingAbuelos').style.display = 'flex';
                document.getElementById('tablaAbuelos').style.display = 'none';
                
                const response = await adminAPI.getAbuelos(params);
                
                if (response.success) {
                    renderAbuelos(response.data.abuelos);
                    renderPagination(response.data);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar abuelos');
            }
        }
        
        // Renderizar abuelos
        function renderAbuelos(abuelos) {
            const tbody = document.getElementById('abuelosBody');
            
            if (abuelos.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-5">
                            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                            <p class="text-muted">No se encontraron abuelos</p>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = abuelos.map(a => `
                    <tr>
                        <td><strong>#${a.id}</strong></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <img src="../${a.foto_url}" class="rounded-circle me-2" width="40" height="40" 
                                     onerror="this.src='../assets/images/placeholder.jpg'" alt="${a.nombre}">
                                <strong>${a.nombre}</strong>
                            </div>
                        </td>
                        <td>${a.edad} años</td>
                        <td>${a.ciudad}</td>
                        <td>
                            <i class="fas fa-${a.genero === 'M' ? 'male text-primary' : 'female text-danger'} me-1"></i>
                            ${a.genero === 'M' ? 'Masculino' : 'Femenino'}
                        </td>
                        <td>${getEstadoBadge(a.estado)}</td>
                        <td><small class="text-muted">${formatDate(a.created_at)}</small></td>
                        <td>
                            <div class="quick-actions">
                                <button class="action-btn action-btn-edit" onclick="editAbuelo(${a.id})" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                ${a.estado !== 'eliminado' ? `
                                    <button class="action-btn action-btn-delete" onclick="deleteAbuelo(${a.id}, '${a.nombre}')" title="Eliminar">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `).join('');
            }
            
            document.getElementById('loadingAbuelos').style.display = 'none';
            document.getElementById('tablaAbuelos').style.display = 'block';
        }
        
        // Renderizar paginación
        function renderPagination(data) {
            if (data.totalPaginas <= 1) {
                document.getElementById('paginacion').style.display = 'none';
                return;
            }
            
            const list = document.getElementById('paginationList');
            let html = '';
            
            // Anterior
            html += `
                <li class="page-item ${data.pagina === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="loadAbuelos(${data.pagina - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;
            
            // Páginas
            for (let i = 1; i <= data.totalPaginas; i++) {
                if (i === 1 || i === data.totalPaginas || (i >= data.pagina - 2 && i <= data.pagina + 2)) {
                    html += `
                        <li class="page-item ${i === data.pagina ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="loadAbuelos(${i}); return false;">${i}</a>
                        </li>
                    `;
                } else if (i === data.pagina - 3 || i === data.pagina + 3) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            // Siguiente
            html += `
                <li class="page-item ${data.pagina === data.totalPaginas ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="loadAbuelos(${data.pagina + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;
            
            list.innerHTML = html;
            document.getElementById('paginacion').style.display = 'block';
        }
        
        // Mostrar modal de crear
        function showCreateModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus me-2"></i>Nuevo Abuelo';
            document.getElementById('abueloForm').reset();
            document.getElementById('abueloId').value = '';
            document.getElementById('charCount').textContent = '0';
            abueloModal.show();
        }
        
        // Editar abuelo
        async function editAbuelo(id) {
            try {
                // Buscar el abuelo en los datos cargados
                const response = await adminAPI.getAbuelos({ limite: 1000 });
                const abuelo = response.data.abuelos.find(a => a.id == id);
                
                if (!abuelo) {
                    alert('Abuelo no encontrado');
                    return;
                }
                
                // Llenar formulario
                document.getElementById('abueloId').value = abuelo.id;
                document.getElementById('nombre').value = abuelo.nombre;
                document.getElementById('edad').value = abuelo.edad;
                document.getElementById('ciudad').value = abuelo.ciudad;
                document.getElementById('genero').value = abuelo.genero || 'M';
                document.getElementById('estado').value = abuelo.estado;
                document.getElementById('descripcion').value = abuelo.descripcion || '';
                document.getElementById('foto_url').value = abuelo.foto_url || '';
                document.getElementById('fecha_nacimiento').value = abuelo.fecha_nacimiento || '';
                document.getElementById('charCount').textContent = (abuelo.descripcion || '').length;
                
                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit me-2"></i>Editar Abuelo';
                abueloModal.show();
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar datos del abuelo');
            }
        }
        
        // Guardar abuelo
        async function saveAbuelo() {
            const id = document.getElementById('abueloId').value;
            const data = {
                nombre: document.getElementById('nombre').value,
                edad: parseInt(document.getElementById('edad').value),
                ciudad: document.getElementById('ciudad').value,
                genero: document.getElementById('genero').value,
                estado: document.getElementById('estado').value,
                descripcion: document.getElementById('descripcion').value,
                foto_url: document.getElementById('foto_url').value || 'assets/images/placeholder.jpg',
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value || null
            };
            
            // Validar
            if (data.descripcion.length < 20) {
                alert('La descripción debe tener al menos 20 caracteres');
                return;
            }
            
            try {
                let response;
                
                if (id) {
                    // Actualizar
                    response = await adminAPI.updateAbuelo(id, data);
                } else {
                    // Crear
                    response = await adminAPI.createAbuelo(data);
                }
                
                if (response.success) {
                    abueloModal.hide();
                    showAlert(response.message, 'success');
                    loadAbuelos(currentPage);
                } else {
                    alert(response.message || 'Error al guardar');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al guardar el abuelo');
            }
        }
        
        // Eliminar abuelo
        async function deleteAbuelo(id, nombre) {
            if (!confirm(`¿Estás seguro de eliminar a ${nombre}?\n\nEsto marcará al abuelo como "eliminado" pero no borrará los datos.`)) {
                return;
            }
            
            try {
                const response = await adminAPI.deleteAbuelo(id);
                
                if (response.success) {
                    showAlert(response.message, 'success');
                    loadAbuelos(currentPage);
                } else {
                    alert(response.message || 'Error al eliminar');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al eliminar el abuelo');
            }
        }
        
        // Buscar abuelos (debounce)
        let searchTimeout;
        function buscarAbuelos() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadAbuelos(1);
            }, 500);
        }
        
        // Utilidades
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return new Intl.DateTimeFormat('es-CO', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            }).format(date);
        }
        
        function getEstadoBadge(estado) {
            const badges = {
                'disponible': '<span class="badge badge-success">Disponible</span>',
                'adoptado': '<span class="badge badge-info">Adoptado</span>',
                'eliminado': '<span class="badge badge-danger">Eliminado</span>'
            };
            return badges[estado] || `<span class="badge badge-secondary">${estado}</span>`;
        }
        
        function getRoleLabel(rol) {
            const labels = {
                'super_admin': 'Super Administrador',
                'admin': 'Administrador',
                'editor': 'Editor'
            };
            return labels[rol] || rol;
        }
        
        async function logout() {
            if (confirm('¿Cerrar sesión?')) {
                await adminAuth.logout();
            }
        }
        
        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.querySelector('.content-wrapper').prepend(alert);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
