<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-envelope me-2"></i>Mensajes de Contacto</h1>
        </div>
        
        <div class="content-wrapper">
            <div class="table-card mb-4">
                <select class="form-select" id="filtroLeido" onchange="loadMensajes()">
                    <option value="">Todos</option>
                    <option value="false" selected>No leídos</option>
                    <option value="true">Leídos</option>
                </select>
            </div>
            
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
            
            <div id="mensajesList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin-components.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initAdminComponents('mensajes');
            loadMensajes();
        });
        
        async function loadMensajes() {
            const leido = document.getElementById('filtroLeido').value;
            
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('mensajesList').innerHTML = '';
                
                const response = await adminAPI.getMensajes({ leido });
                
                if (response.success) {
                    const container = document.getElementById('mensajesList');
                    container.innerHTML = response.data.mensajes.map(m => {
                        const esNuevo = m.estado === 'nuevo';
                        return `
                            <div class="card mb-3 ${esNuevo ? 'border-primary' : ''}">
                                <div class="card-body">
                                    <h5>
                                        ${esNuevo ? '<i class="fas fa-circle text-primary" style="font-size: 8px;"></i> ' : ''}
                                        ${m.nombre}
                                        <span class="badge badge-${esNuevo ? 'primary' : 'secondary'} ms-2">${m.estado}</span>
                                    </h5>
                                    <p class="text-muted">
                                        <i class="fas fa-envelope me-1"></i>${m.email} 
                                        ${m.telefono ? '• <i class="fas fa-phone me-1"></i>' + m.telefono : ''}
                                    </p>
                                    ${m.asunto ? `<p class="text-muted"><strong>Asunto:</strong> ${m.asunto}</p>` : ''}
                                    <p>${m.mensaje}</p>
                                    <div class="d-flex gap-2">
                                        ${esNuevo ? `<button class="btn btn-sm btn-primary" onclick="marcarLeido(${m.id})"><i class="fas fa-check"></i> Marcar Leído</button>` : ''}
                                        <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${m.id})"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function marcarLeido(id) {
            try {
                await adminAPI.marcarMensajeLeido(id);
                loadMensajes();
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function eliminar(id) {
            if (!confirm('¿Eliminar este mensaje?')) return;
            
            try {
                await adminAPI.deleteMensaje(id);
                loadMensajes();
            } catch (error) {
                alert('Error al eliminar');
            }
        }
        
        async function logout() {
            if (confirm('¿Cerrar sesión?')) await adminAuth.logout();
        }
    </script>
</body>
</html>
