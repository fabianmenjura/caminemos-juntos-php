<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donaciones - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-heart fa-2x mb-2" style="color: #ff8c42;"></i>
            <h3>Adopta un Abuelo</h3>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html" class="menu-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
            <a href="hero-slider.html" class="menu-item"><i class="fas fa-images"></i><span>Hero Slider</span></a>
            <a href="abuelos.html" class="menu-item"><i class="fas fa-users"></i><span>Abuelos</span></a>
            <a href="donaciones.html" class="menu-item active"><i class="fas fa-hand-holding-heart"></i><span>Donaciones</span></a>
            <a href="mensajes.html" class="menu-item"><i class="fas fa-envelope"></i><span>Mensajes</span></a>
            <a href="voluntarios.html" class="menu-item"><i class="fas fa-user-friends"></i><span>Voluntarios</span></a>
            <a href="testimonios.html" class="menu-item"><i class="fas fa-star"></i><span>Testimonios</span></a>
        </div>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión</button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-hand-holding-heart me-2"></i>Donaciones</h1>
        </div>
        
        <div class="content-wrapper">
            <div class="table-card mb-4">
                <select class="form-select" id="filtroTipo" onchange="loadDonaciones()">
                    <option value="todas" selected>Todas</option>
                    <option value="personas">Personas</option>
                    <option value="empresas">Empresas</option>
                </select>
            </div>
            
            <div class="table-card">
                <div id="loading" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
                
                <div class="table-responsive" id="tabla" style="display: none;">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Tipo</th><th>Nombre</th><th>Email</th><th>Monto</th><th>Método</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        (async function() {
            if (!await adminAuth.requireAuth()) return;
            loadDonaciones();
        })();
        
        async function loadDonaciones() {
            const tipo = document.getElementById('filtroTipo').value;
            
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('tabla').style.display = 'none';
                
                const response = await adminAPI.getDonaciones({ tipo });
                
                if (response.success) {
                    const tbody = document.getElementById('tbody');
                    tbody.innerHTML = response.data.donaciones.map(d => {
                        const esPersona = d.tipo_categoria === 'persona';
                        const tipo = esPersona ? 'persona' : 'empresa';
                        
                        return `
                            <tr>
                                <td><strong>#${d.id}</strong></td>
                                <td><span class="badge ${esPersona ? 'badge-info' : 'badge-primary'}">${esPersona ? 'Persona' : 'Empresa'}</span></td>
                                <td>${d.nombre || d.nombre_completo || d.nombre_empresa || 'N/A'}</td>
                                <td><small>${d.email || d.email_contacto || 'N/A'}</small></td>
                                <td><strong>$${parseInt(d.monto).toLocaleString()}</strong></td>
                                <td><small>${d.metodo_pago || d.metodo || 'N/A'}</small></td>
                                <td>
                                    <select class="form-select form-select-sm" onchange="cambiarEstado('${tipo}', ${d.id}, this.value)" style="width: auto;">
                                        <option value="pendiente" ${d.estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                                        <option value="completada" ${d.estado === 'completada' ? 'selected' : ''}>✅ Completada</option>
                                        <option value="cancelada" ${d.estado === 'cancelada' ? 'selected' : ''}>❌ Cancelada</option>
                                    </select>
                                </td>
                                <td><small>${new Date(d.fecha_donacion || d.created_at || d.fecha).toLocaleDateString()}</small></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-info" onclick="verDetalle(${d.id}, '${tipo}')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('tabla').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function cambiarEstado(tipo, id, nuevoEstado) {
            if (!confirm(`¿Cambiar estado a "${nuevoEstado}"?`)) {
                loadDonaciones(); // Recargar para restaurar el select
                return;
            }
            
            try {
                const response = await adminAPI.updateDonacionEstado(tipo, id, nuevoEstado);
                
                if (response.success) {
                    alert('✅ Estado actualizado');
                    loadDonaciones();
                } else {
                    alert('Error: ' + response.message);
                    loadDonaciones();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al actualizar estado');
                loadDonaciones();
            }
        }
        
        function verDetalle(id, tipo) {
            // TODO: Mostrar modal con detalles completos
            alert(`Ver detalle de donación ${tipo} #${id}\n\nPróximamente: Modal con toda la información`);
        }
        
        async function logout() {
            if (confirm('¿Cerrar sesión?')) await adminAuth.logout();
        }
    </script>
</body>
</html>
