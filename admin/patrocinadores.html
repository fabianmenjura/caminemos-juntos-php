<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/placeholder-logo.png">
    <link rel="shortcut icon" type="image/png" href="../assets/images/placeholder-logo.png">
    
    <title>Patrocinadores - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
    
    <!-- Main -->
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-building me-2"></i>Gestión de Patrocinadores</h1>
            <button class="btn btn-primary" onclick="showCreateModal()">
                <i class="fas fa-plus me-2"></i>Nuevo Patrocinador
            </button>
        </div>
        
        <div class="content-wrapper">
            <!-- Info -->
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i>
                Los aliados se muestran en la página principal. Todos son igualmente importantes. Usa el campo "Orden" para controlar su posición.
            </div>

            <!-- Loading -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="text-muted mt-2">Cargando patrocinadores...</p>
            </div>

            <!-- Grid -->
            <div id="patrocinadores-container" class="row" style="display: none;">
                <!-- Dinámico -->
            </div>

            <!-- No data -->
            <div id="no-data" class="text-center py-5" style="display: none;">
                <i class="fas fa-building fa-3x text-muted mb-3"></i>
                <p class="text-muted">No hay patrocinadores registrados</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="patrocinadorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Patrocinador</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="patrocinadorForm">
                        <input type="hidden" id="patrocinadorId">
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre de la Empresa *</label>
                            <input type="text" class="form-control" id="nombre_empresa" required placeholder="Ej: Fundación Corazón">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-image me-2"></i>Logo</label>
                            
                            <div class="mb-3">
                                <img id="imagePreview" src="../assets/images/placeholder-logo.png" 
                                     class="rounded" style="max-width: 200px; background: #f0f0f0; padding: 10px;" alt="Preview">
                            </div>
                            
                            <div class="input-group mb-2">
                                <input type="file" class="form-control" id="imageFile" accept="image/*" onchange="previewImage(this)">
                                <button class="btn btn-outline-primary" type="button" onclick="uploadImage()">
                                    <i class="fas fa-upload me-1"></i>Subir
                                </button>
                            </div>
                            
                            <input type="text" class="form-control" id="logo_url" placeholder="assets/images/logo-empresa.jpg" readonly required>
                            
                            <div id="uploadProgress" class="mt-2" style="display: none;">
                                <div class="progress">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%">
                                        Subiendo...
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Sitio Web</label>
                            <input type="url" class="form-control" id="sitio_web" placeholder="https://ejemplo.com">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="2" placeholder="Breve descripción del patrocinio..."></textarea>
                        </div>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Orden</label>
                                <input type="number" class="form-control" id="orden" value="0" min="0">
                                <small class="text-muted">Menor número = aparece primero</small>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Estado</label>
                                <select class="form-select" id="activo">
                                    <option value="1">Activo (visible en web)</option>
                                    <option value="0">Inactivo (oculto)</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="savePatrocinador()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/admin-components.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        let modal;
        let patrocinadores = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await initAdminComponents('patrocinadores');
            modal = new bootstrap.Modal(document.getElementById('patrocinadorModal'));
            loadPatrocinadores();
        });

        // Cargar
        async function loadPatrocinadores() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('patrocinadores-container').style.display = 'none';
                document.getElementById('no-data').style.display = 'none';

                const response = await adminAPI.get('admin/patrocinadores');

                if (response.success) {
                    patrocinadores = response.data.patrocinadores;
                    renderPatrocinadores();
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudieron cargar los patrocinadores'
                });
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Renderizar
        function renderPatrocinadores() {
            const container = document.getElementById('patrocinadores-container');

            if (patrocinadores.length === 0) {
                document.getElementById('no-data').style.display = 'block';
                return;
            }

            container.style.display = 'flex';
            container.innerHTML = patrocinadores.map(p => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span class="badge bg-primary">Orden: ${p.orden}</span>
                            <span class="badge ${p.activo ? 'bg-success' : 'bg-secondary'}">
                                ${p.activo ? 'Activo' : 'Inactivo'}
                            </span>
                        </div>
                        <div class="card-body text-center">
                            <img src="../${p.logo_url}" class="img-fluid mb-3" style="max-height: 100px;" alt="${p.nombre_empresa}">
                            <h5 class="card-title">${p.nombre_empresa}</h5>
                            ${p.sitio_web ? `<p class="small"><a href="${p.sitio_web}" target="_blank">${p.sitio_web}</a></p>` : ''}
                            ${p.descripcion ? `<p class="text-muted small">${p.descripcion}</p>` : ''}
                            <p class="text-muted small mb-0">Orden: ${p.orden}</p>
                        </div>
                        <div class="card-footer bg-white">
                            <div class="btn-group w-100">
                                <button class="btn btn-sm btn-primary" onclick="editPatrocinador(${p.id})">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn btn-sm btn-${p.activo ? 'warning' : 'success'}" 
                                        onclick="toggleActivo(${p.id}, ${!p.activo})">
                                    <i class="fas fa-${p.activo ? 'eye-slash' : 'eye'}"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminar(${p.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Crear
        function showCreateModal() {
            document.getElementById('patrocinadorForm').reset();
            document.getElementById('patrocinadorId').value = '';
            document.getElementById('imagePreview').src = '../assets/images/placeholder-logo.png';
            document.getElementById('modalTitle').textContent = 'Nuevo Patrocinador';
            modal.show();
        }

        // Editar
        function editPatrocinador(id) {
            const p = patrocinadores.find(pat => pat.id === id);
            if (!p) return;

            document.getElementById('patrocinadorId').value = p.id;
            document.getElementById('nombre_empresa').value = p.nombre_empresa;
            document.getElementById('logo_url').value = p.logo_url;
            document.getElementById('sitio_web').value = p.sitio_web || '';
            document.getElementById('descripcion').value = p.descripcion || '';
            document.getElementById('orden').value = p.orden;
            document.getElementById('activo').value = p.activo;
            document.getElementById('imagePreview').src = '../' + p.logo_url;
            document.getElementById('modalTitle').textContent = 'Editar Patrocinador';
            
            modal.show();
        }

        // Guardar
        async function savePatrocinador() {
            const id = document.getElementById('patrocinadorId').value;
            const data = {
                nombre_empresa: document.getElementById('nombre_empresa').value,
                logo_url: document.getElementById('logo_url').value,
                sitio_web: document.getElementById('sitio_web').value || null,
                descripcion: document.getElementById('descripcion').value || null,
                orden: parseInt(document.getElementById('orden').value) || 0,
                activo: parseInt(document.getElementById('activo').value)
            };

            try {
                let response;
                if (id) {
                    response = await adminAPI.put(`admin/patrocinadores/${id}`, data);
                } else {
                    response = await adminAPI.post('admin/patrocinadores', data);
                }

                if (response.success) {
                    modal.hide();
                    await Swal.fire({
                        icon: 'success',
                        title: '¡Guardado!',
                        text: response.message || 'Patrocinador guardado correctamente',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    loadPatrocinadores();
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo guardar el patrocinador'
                });
            }
        }

        // Toggle activo
        async function toggleActivo(id, nuevoEstado) {
            try {
                Swal.fire({
                    title: 'Actualizando...',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                const response = await adminAPI.put(`admin/patrocinadores/${id}`, { activo: nuevoEstado ? 1 : 0 });
                if (response.success) {
                    await Swal.fire({
                        icon: 'success',
                        title: '¡Listo!',
                        text: nuevoEstado ? 'Patrocinador activado' : 'Patrocinador desactivado',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    loadPatrocinadores();
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo actualizar'
                });
            }
        }

        // Eliminar
        async function eliminar(id) {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                text: 'Esta acción marcará el patrocinador como eliminado',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!result.isConfirmed) return;

            try {
                Swal.fire({
                    title: 'Eliminando...',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                const response = await adminAPI.delete(`admin/patrocinadores/${id}`);
                if (response.success) {
                    await Swal.fire({
                        icon: 'success',
                        title: '¡Eliminado!',
                        text: 'Patrocinador eliminado correctamente',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    loadPatrocinadores();
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo eliminar el patrocinador'
                });
            }
        }

        // Preview imagen
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('imagePreview').src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Subir imagen
        async function uploadImage() {
            const fileInput = document.getElementById('imageFile');
            
            if (!fileInput.files || !fileInput.files[0]) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Atención',
                    text: 'Selecciona una imagen primero'
                });
                return;
            }

            const file = fileInput.files[0];

            if (file.size > 5 * 1024 * 1024) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Archivo muy grande',
                    text: 'El tamaño máximo es 5MB'
                });
                return;
            }

            try {
                document.getElementById('uploadProgress').style.display = 'block';
                
                const response = await adminAPI.uploadImage(file);

                if (response.success) {
                    document.getElementById('logo_url').value = response.data.url;
                    document.getElementById('imagePreview').src = '../' + response.data.url;
                    
                    await Swal.fire({
                        icon: 'success',
                        title: '¡Logo subido!',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    fileInput.value = '';
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'No se pudo subir el logo'
                });
            } finally {
                document.getElementById('uploadProgress').style.display = 'none';
            }
        }

    </script>
</body>
</html>
