<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-heart fa-2x mb-2" style="color: #ff8c42;"></i>
            <h3>Caminemos Juntos</h3>
            <p>Panel de Administración</p>
        </div>
        
        <div class="sidebar-menu">
            <a href="dashboard.html" class="menu-item active">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="hero-slider.html" class="menu-item">
                <i class="fas fa-images"></i>
                <span>Hero Slider</span>
            </a>
            <a href="abuelos.html" class="menu-item">
                <i class="fas fa-users"></i>
                <span>Abuelos</span>
            </a>
            <a href="donaciones.html" class="menu-item">
                <i class="fas fa-hand-holding-heart"></i>
                <span>Donaciones</span>
            </a>
            <a href="mensajes.html" class="menu-item">
                <i class="fas fa-envelope"></i>
                <span>Mensajes</span>
            </a>
            <a href="mensajes-cumpleanos.html" class="menu-item">
                <i class="fas fa-birthday-cake"></i>
                <span>Felicitaciones</span>
            </a>
            <a href="voluntarios.html" class="menu-item">
                <i class="fas fa-hand-holding-heart"></i>
                <span>Voluntarios</span>
            </a>
            <a href="testimonios.html" class="menu-item">
                <i class="fas fa-star"></i>
                <span>Testimonios</span>
            </a>
            <a href="patrocinadores.html" class="menu-item">
                <i class="fas fa-building"></i>
                <span>Patrocinadores</span>
            </a>
        </div>
        
        <div class="sidebar-footer">
            <p class="text-white mb-2"><i class="fas fa-user me-2"></i><span id="userName">Admin</span></p>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </button>
        </div>
    </div>
    
    <!-- Main -->
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-chart-line me-2"></i>Dashboard</h1>
        </div>
        
        <div class="content-wrapper">
            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="totalAbuelos">0</div>
                        <div class="stat-card-label">Abuelos Disponibles</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="totalDonaciones">0</div>
                        <div class="stat-card-label">Total Donaciones</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="totalMensajes">0</div>
                        <div class="stat-card-label">Mensajes</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="pagosExitosos">0</div>
                        <div class="stat-card-label">Pagos Exitosos</div>
                    </div>
                </div>
            </div>
            
            <!-- Donaciones Recientes -->
            <div class="table-card">
                <h5 class="mb-3"><i class="fas fa-history me-2"></i>Donaciones Recientes</h5>
                <div id="loadingDonaciones" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
                <div class="table-responsive" id="tablaDonaciones" style="display: none;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Nombre</th>
                                <th>Monto</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="donacionesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        (async function() {
            console.log('Verificando autenticación...');
            console.log('Token:', adminAuth.token);
            console.log('User:', adminAuth.user);
            
            // Si no hay token, redirigir a login
            if (!adminAuth.isAuthenticated()) {
                console.log('No hay token, redirigiendo a login');
                window.location.href = 'login.html';
                return;
            }
            
            // Verificar sesión en el servidor
            const isValid = await adminAuth.verifySession();
            
            if (!isValid) {
                console.log('Sesión inválida, redirigiendo a login');
                window.location.href = 'login.html';
                return;
            }
            
            console.log('Autenticación exitosa');
            
            if (adminAuth.user) {
                document.getElementById('userName').textContent = adminAuth.user.nombre_completo;
            }
            
            loadDashboard();
        })();
        
        async function loadDashboard() {
            try {
                const response = await adminAPI.getDashboard();
                
                if (response.success) {
                    const stats = response.data;
                    
                    document.getElementById('totalAbuelos').textContent = stats.abuelos.total;
                    document.getElementById('totalDonaciones').textContent = 
                        stats.donaciones.total_personas + stats.donaciones.total_empresas;
                    document.getElementById('totalMensajes').textContent = stats.mensajes.total;
                    document.getElementById('pagosExitosos').textContent = stats.transacciones.exitosas;
                    
                    if (stats.donaciones_recientes && stats.donaciones_recientes.length > 0) {
                        renderDonaciones(stats.donaciones_recientes);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function renderDonaciones(donaciones) {
            const tbody = document.getElementById('donacionesBody');
            tbody.innerHTML = donaciones.map(d => `
                <tr>
                    <td><span class="badge ${d.tipo === 'persona' ? 'badge-info' : 'badge-primary'}">${d.tipo}</span></td>
                    <td>${d.nombre}</td>
                    <td>$${parseInt(d.monto).toLocaleString()}</td>
                    <td><span class="badge badge-${d.estado === 'completada' ? 'success' : 'warning'}">${d.estado}</span></td>
                    <td><small>${new Date(d.fecha).toLocaleDateString()}</small></td>
                </tr>
            `).join('');
            
            document.getElementById('loadingDonaciones').style.display = 'none';
            document.getElementById('tablaDonaciones').style.display = 'block';
        }
        
        async function logout() {
            if (confirm('¿Cerrar sesión?')) await adminAuth.logout();
        }
    </script>
</body>
</html>
