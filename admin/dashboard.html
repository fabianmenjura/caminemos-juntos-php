<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/placeholder-logo.png">
    <link rel="shortcut icon" type="image/png" href="../assets/images/placeholder-logo.png">
    <link rel="apple-touch-icon" href="../assets/images/placeholder-logo.png">
    
    <title>Dashboard - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>
    
    <!-- Main -->
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-chart-line me-2"></i>Dashboard</h1>
        </div>
        
        <div class="content-wrapper">
            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="totalAbuelos">0</div>
                        <div class="stat-card-label">Abuelos Disponibles</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="totalDonaciones">0</div>
                        <div class="stat-card-label">Total Donaciones</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="totalMensajes">0</div>
                        <div class="stat-card-label">Mensajes</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-card-value" id="pagosExitosos">0</div>
                        <div class="stat-card-label">Pagos Exitosos</div>
                    </div>
                </div>
            </div>
            
            <!-- Donaciones Recientes -->
            <div class="table-card">
                <h5 class="mb-3"><i class="fas fa-history me-2"></i>Donaciones Recientes</h5>
                <div id="loadingDonaciones" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
                <div class="table-responsive" id="tablaDonaciones" style="display: none;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Nombre</th>
                                <th>Monto</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="donacionesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/admin-components.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initAdminComponents('dashboard');
            loadDashboard();
        });
        
        async function loadDashboard() {
            try {
                const response = await adminAPI.getDashboard();
                
                if (response.success) {
                    const stats = response.data;
                    
                    document.getElementById('totalAbuelos').textContent = stats.abuelos.total;
                    document.getElementById('totalDonaciones').textContent = 
                        stats.donaciones.total_personas + stats.donaciones.total_empresas;
                    document.getElementById('totalMensajes').textContent = stats.mensajes.total;
                    document.getElementById('pagosExitosos').textContent = stats.transacciones.exitosas;
                    
                    if (stats.donaciones_recientes && stats.donaciones_recientes.length > 0) {
                        renderDonaciones(stats.donaciones_recientes);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function renderDonaciones(donaciones) {
            const tbody = document.getElementById('donacionesBody');
            tbody.innerHTML = donaciones.map(d => `
                <tr>
                    <td><span class="badge ${d.tipo === 'persona' ? 'badge-info' : 'badge-primary'}">${d.tipo}</span></td>
                    <td>${d.nombre}</td>
                    <td>$${parseInt(d.monto).toLocaleString()}</td>
                    <td><span class="badge badge-${d.estado === 'completada' ? 'success' : 'warning'}">${d.estado}</span></td>
                    <td><small>${new Date(d.fecha).toLocaleDateString()}</small></td>
                </tr>
            `).join('');
            
            document.getElementById('loadingDonaciones').style.display = 'none';
            document.getElementById('tablaDonaciones').style.display = 'block';
        }
        
    </script>
</body>
</html>
