<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonios - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-heart fa-2x mb-2" style="color: #ff8c42;"></i>
            <h3>Caminemos Juntos</h3>
            <p>Panel de Administración</p>
        </div>
        
        <div class="sidebar-menu">
            <a href="dashboard.html" class="menu-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="hero-slider.html" class="menu-item">
                <i class="fas fa-images"></i>
                <span>Hero Slider</span>
            </a>
            <a href="abuelos.html" class="menu-item">
                <i class="fas fa-users"></i>
                <span>Abuelos</span>
            </a>
            <a href="donaciones.html" class="menu-item">
                <i class="fas fa-hand-holding-heart"></i>
                <span>Donaciones</span>
            </a>
            <a href="mensajes.html" class="menu-item">
                <i class="fas fa-envelope"></i>
                <span>Mensajes</span>
            </a>
            <a href="voluntarios.html" class="menu-item">
                <i class="fas fa-user-friends"></i>
                <span>Voluntarios</span>
            </a>
            <a href="testimonios.html" class="menu-item active">
                <i class="fas fa-star"></i>
                <span>Testimonios</span>
            </a>
            <a href="patrocinadores.html" class="menu-item">
                <i class="fas fa-building"></i>
                <span>Patrocinadores</span>
            </a>
        </div>
        
        <div class="sidebar-footer">
            <p class="text-white mb-2"><i class="fas fa-user me-2"></i><span id="userName">Admin</span></p>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </button>
        </div>
    </div>
    
    <!-- Main -->
    <div class="main-content">
        <div class="topbar">
            <h1><i class="fas fa-star me-2"></i>Gestión de Testimonios</h1>
        </div>
        
        <div class="content-wrapper">
            <!-- Filtros -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Filtrar por Estado</label>
                            <select class="form-select" id="filter-estado">
                                <option value="todos">Todos</option>
                                <option value="pendientes">Pendientes de Aprobar</option>
                                <option value="aprobados">Aprobados</option>
                            </select>
                        </div>
                        <div class="col-md-8 text-end">
                            <span class="badge bg-primary me-2" id="count-badge">Total: 0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="text-muted mt-2">Cargando testimonios...</p>
            </div>

            <!-- Grid -->
            <div id="testimonios-container" class="row" style="display: none;">
                <!-- Dinámico -->
            </div>

            <!-- No data -->
            <div id="no-data" class="text-center py-5" style="display: none;">
                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                <p class="text-muted">No hay testimonios</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-api.js"></script>
    <script>
        let testimonios = [];

        // Verificar sesión
        if (!verifySession()) {
            window.location.href = 'login.html';
        }

        // Cargar testimonios
        async function loadTestimonios(estado = 'todos') {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('testimonios-container').style.display = 'none';
                document.getElementById('no-data').style.display = 'none';

                const url = estado !== 'todos' ? `admin/testimonios?estado=${estado}` : 'admin/testimonios';
                const response = await adminAPI.get(url);

                if (response.success) {
                    testimonios = response.data.testimonios;
                    document.getElementById('count-badge').textContent = `Total: ${testimonios.length}`;
                    renderTestimonios();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar testimonios');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Renderizar
        function renderTestimonios() {
            const container = document.getElementById('testimonios-container');

            if (testimonios.length === 0) {
                document.getElementById('no-data').style.display = 'block';
                return;
            }

            document.getElementById('testimonios-container').style.display = 'flex';

            container.innerHTML = testimonios.map(t => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge ${t.aprobado ? 'bg-success' : 'bg-warning text-dark'}">
                                    ${t.aprobado ? 'Aprobado' : 'Pendiente'}
                                </span>
                                ${t.destacado ? '<span class="badge bg-primary ms-1">Destacado</span>' : ''}
                            </div>
                            <div class="text-warning">
                                ${'<i class="fas fa-star"></i>'.repeat(t.calificacion)}
                            </div>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">${t.nombre}</h5>
                            <p class="text-muted small mb-2">${t.rol}</p>
                            <p class="card-text">${t.testimonio.length > 150 ? t.testimonio.substring(0, 150) + '...' : t.testimonio}</p>
                            <small class="text-muted">${formatDate(t.created_at)}</small>
                        </div>
                        <div class="card-footer bg-white">
                            <div class="d-flex gap-2 flex-wrap">
                                ${!t.aprobado ? `
                                    <button class="btn btn-sm btn-success" onclick="aprobar(${t.id})">
                                        <i class="fas fa-check"></i> Aprobar
                                    </button>
                                ` : ''}
                                <button class="btn btn-sm btn-${t.destacado ? 'warning' : 'primary'}" 
                                        onclick="toggleDestacado(${t.id}, ${!t.destacado})">
                                    <i class="fas fa-star"></i> ${t.destacado ? 'Quitar' : 'Destacar'}
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="eliminar(${t.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Aprobar
        async function aprobar(id) {
            try {
                const response = await adminAPI.put(`admin/testimonios/${id}`, { aprobado: true });
                if (response.success) {
                    alert('Testimonio aprobado');
                    loadTestimonios(document.getElementById('filter-estado').value);
                }
            } catch (error) {
                alert('Error al aprobar');
            }
        }

        // Toggle destacado
        async function toggleDestacado(id, destacar) {
            try {
                const response = await adminAPI.put(`admin/testimonios/${id}`, { destacado: destacar });
                if (response.success) {
                    alert(destacar ? 'Testimonio destacado' : 'Ya no está destacado');
                    loadTestimonios(document.getElementById('filter-estado').value);
                }
            } catch (error) {
                alert('Error al actualizar');
            }
        }

        // Eliminar
        async function eliminar(id) {
            if (!confirm('¿Eliminar este testimonio?')) return;

            try {
                const response = await adminAPI.delete(`admin/testimonios/${id}`);
                if (response.success) {
                    alert('Testimonio eliminado');
                    loadTestimonios(document.getElementById('filter-estado').value);
                }
            } catch (error) {
                alert('Error al eliminar');
            }
        }

        // Helpers
        function formatDate(dateString) {
            if (!dateString) return '-';
            return new Date(dateString).toLocaleString('es-CO');
        }

        // Events
        document.getElementById('filter-estado').addEventListener('change', (e) => loadTestimonios(e.target.value));

        // Init
        loadTestimonios();
    </script>
</body>
</html>
