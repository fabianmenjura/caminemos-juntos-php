<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/placeholder-logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/placeholder-logo.png">
    <link rel="apple-touch-icon" href="assets/images/placeholder-logo.png">
    
    <!-- SEO -->
    <title>Nuestros Adultos Mayores - Conoce sus Historias | Caminemos Juntos Chiquinquirá</title>
    <meta name="description" content="Conoce a los adultos mayores de Chiquinquirá que buscan compañía. Historias reales de abuelos que necesitan tu apoyo. Adopta un abuelo hoy.">
    <meta name="keywords" content="abuelos chiquinquirá, adultos mayores boyacá, adoptar abuelo, historias tercera edad, fundación colombia">
    <link rel="canonical" href="https://caminemosjuntos.org/abuelos.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Conoce a Nuestros Adultos Mayores - Caminemos Juntos">
    <meta property="og:description" content="Historias reales de adultos mayores en Chiquinquirá que buscan compañía y apoyo.">
    <meta property="og:url" content="https://caminemosjuntos.org/abuelos.html">
    <meta property="og:image" content="https://caminemosjuntos.org/assets/images/elderly-colombian-woman-smiling-warm.jpg">
    
    <!-- Preconnect -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-image-container">
            <img src="assets/images/elderly-colombian-woman-happy-flowers.jpg" 
                 alt="Adultos mayores felices" 
                 class="hero-bg-image">
        </div>
        <div class="hero-overlay"></div>
        <div class="container">
            <div class="row align-items-center" style="min-height: 500px;">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="hero-title" data-aos="fade-up">Nuestros Adultos Mayores</h1>
                    <p class="hero-subtitle" data-aos="fade-up" data-aos-delay="100">
                        Conoce las historias de adultos mayores que buscan compañía, cariño y esperanza
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap" data-aos="fade-up" data-aos-delay="200">
                        <a href="#todos-abuelos" class="btn btn-light btn-lg">
                            <i class="fas fa-heart me-2"></i>Ver Adultos Mayores
                        </a>
                        <a href="donar.html" class="btn btn-outline-light btn-lg">
                            <i class="fas fa-hand-holding-heart me-2"></i>Donar Ahora
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filtros -->
    <section class="py-4 bg-light">
        <div class="container">
            <div class="row align-items-center g-3">
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1">Estado:</label>
                    <select class="form-select" id="filtroEstado">
                        <option value="">Todos</option>
                        <option value="disponible" selected>Disponibles</option>
                        <option value="adoptado">Adoptados</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1">Ciudad:</label>
                    <input type="text" class="form-control" id="filtroCiudad" placeholder="Buscar por ciudad...">
                </div>
                <div class="col-md-4 text-end">
                    <span class="badge bg-primary fs-6 mt-3 mt-md-4" id="totalAbuelos">0 abuelos</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Adultos Mayores -->
    <section id="todos-abuelos" class="py-5">
        <div class="container">
            <!-- Loading -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                <p class="text-muted mt-3">Cargando abuelos...</p>
            </div>

            <!-- Grid de Adultos Mayores -->
            <div id="abuelos-grid" class="row g-4" style="display: none;">

            </div>

            <!-- No hay abuelos -->
            <div id="no-abuelos" class="text-center py-5" style="display: none;">
                <i class="fas fa-users fa-3x text-muted mb-3"></i>
                <p class="text-muted">No hay abuelos con estos filtros</p>
            </div>

            <!-- Paginación -->
            <div id="pagination" class="mt-5" style="display: none;">
                <nav>
                    <ul class="pagination justify-content-center">
        
                    </ul>
                </nav>
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- WhatsApp Button Container -->
    <div id="whatsapp-container"></div>

    <!-- Spinner Container -->
    <div id="spinner-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        // Inicializar componentes reutilizables
        initComponents('abuelos');

        let todosAbuelos = [];
        let abuelosFiltrados = [];
        let paginaActual = 1;
        const abuelosPorPagina = 12;

        // Global Spinner
        const globalSpinner = {
            element: document.getElementById('globalSpinner'),
            textElement: document.querySelector('#globalSpinner p'),
            show: function(message = 'Cargando...') {
                if (this.element) {
                    this.textElement.textContent = message;
                    this.element.classList.add('active');
                }
            },
            hide: function() {
                if (this.element) {
                    this.element.classList.remove('active');
                }
            }
        };

        // SweetAlert wrappers
        function showSuccess(message, title = 'Éxito') {
            return Swal.fire({ icon: 'success', title, text: message, timer: 3000, showConfirmButton: false });
        }

        function showError(message, title = 'Error') {
            return Swal.fire({ icon: 'error', title, text: message });
        }

        // Cargar todos los abuelos
        async function cargarAbuelos() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('abuelos-grid').style.display = 'none';
                document.getElementById('no-abuelos').style.display = 'none';

                const response = await api.getAbuelos({ limit: 100 });

                if (response.success && response.data.abuelos) {
                    todosAbuelos = response.data.abuelos;
                    abuelosFiltrados = todosAbuelos;
                    actualizarTotal();
                    renderizarAbuelos();
                }
            } catch (error) {
                console.error('Error:', error);
                showError('No se pudieron cargar los abuelos');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Renderizar abuelos
        function renderizarAbuelos() {
            const grid = document.getElementById('abuelos-grid');
            
            if (abuelosFiltrados.length === 0) {
                document.getElementById('no-abuelos').style.display = 'block';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            // Calcular paginación
            const inicio = (paginaActual - 1) * abuelosPorPagina;
            const fin = inicio + abuelosPorPagina;
            const abuelosPagina = abuelosFiltrados.slice(inicio, fin);

            grid.innerHTML = abuelosPagina.map(abuelo => {
                const imageUrl = fixImagePath(abuelo.foto_url);
                const cumpleHoy = abuelo.cumple_hoy == 1;
                const cumpleEstaSemana = abuelo.cumple_esta_semana == 1;
                const totalMensajes = abuelo.total_mensajes || 0;

                return `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-4" data-aos="fade-up">
                        <div class="card grandparent-card h-100 ${cumpleHoy ? 'border-warning border-3' : ''}">
                            ${cumpleHoy ? '<div class="ribbon-birthday">🎂 ¡Cumpleaños Hoy!</div>' : ''}
                            ${!cumpleHoy && cumpleEstaSemana ? '<div class="ribbon-birthday-soon">🎈 Cumple pronto</div>' : ''}
                            <img src="${imageUrl}" 
                                 class="card-img-top" 
                                 alt="${abuelo.nombre}, ${abuelo.edad} años, ${abuelo.ciudad}"
                                 loading="lazy"
                                 onerror="this.src='assets/images/placeholder.jpg'"
                                 style="height: 250px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title">${abuelo.nombre}</h5>
                                <p class="text-muted">
                                    <i class="fas fa-map-marker-alt me-1"></i>
                                    ${abuelo.ciudad} • ${abuelo.edad} años
                                </p>
                                <p class="card-text">${abuelo.descripcion.substring(0, 100)}...</p>
                                
                                ${totalMensajes > 0 ? `
                                    <div class="alert alert-warning py-1 px-2 mb-2 small">
                                        💌 ${totalMensajes} felicitación${totalMensajes > 1 ? 'es' : ''}
                                    </div>
                                ` : ''}
                                
                                <div class="d-flex gap-2">
                                    <a href="donar.html" class="btn btn-primary btn-sm flex-grow-1">
                                        <i class="fas fa-heart me-1"></i>Apoyar
                                    </a>
                                    ${(cumpleHoy || cumpleEstaSemana) ? `
                                        <button class="btn btn-warning btn-sm" onclick="mostrarModalCumpleanos(${abuelo.id}, '${abuelo.nombre}')" title="Felicitar">
                                            🎂
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            grid.style.display = 'flex';
            renderizarPaginacion();
        }

        // Paginación
        function renderizarPaginacion() {
            const totalPaginas = Math.ceil(abuelosFiltrados.length / abuelosPorPagina);
            const pagination = document.querySelector('#pagination ul');

            if (totalPaginas <= 1) {
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            document.getElementById('pagination').style.display = 'block';

            let html = '';

            // Anterior
            html += `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#todos-abuelos" onclick="cambiarPagina(${paginaActual - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;

            // Números
            for (let i = 1; i <= totalPaginas; i++) {
                if (i === 1 || i === totalPaginas || (i >= paginaActual - 1 && i <= paginaActual + 1)) {
                    html += `
                        <li class="page-item ${i === paginaActual ? 'active' : ''}">
                            <a class="page-link" href="#todos-abuelos" onclick="cambiarPagina(${i}); return false;">${i}</a>
                        </li>
                    `;
                } else if (i === paginaActual - 2 || i === paginaActual + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            // Siguiente
            html += `
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <a class="page-link" href="#todos-abuelos" onclick="cambiarPagina(${paginaActual + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;

            pagination.innerHTML = html;
        }

        function cambiarPagina(pagina) {
            const totalPaginas = Math.ceil(abuelosFiltrados.length / abuelosPorPagina);
            if (pagina < 1 || pagina > totalPaginas) return;
            
            paginaActual = pagina;
            renderizarAbuelos();
            
            // Scroll suave al inicio de la grid
            document.getElementById('todos-abuelos').scrollIntoView({ behavior: 'smooth' });
        }

        // Filtros
        function aplicarFiltros() {
            const estado = document.getElementById('filtroEstado').value;
            const ciudad = document.getElementById('filtroCiudad').value.toLowerCase();

            abuelosFiltrados = todosAbuelos.filter(abuelo => {
                const matchEstado = !estado || abuelo.estado === estado;
                const matchCiudad = !ciudad || abuelo.ciudad.toLowerCase().includes(ciudad);
                return matchEstado && matchCiudad;
            });

            paginaActual = 1;
            actualizarTotal();
            renderizarAbuelos();
        }

        function actualizarTotal() {
            document.getElementById('totalAbuelos').textContent = 
                `${abuelosFiltrados.length} abuelo${abuelosFiltrados.length !== 1 ? 's' : ''}`;
        }

        function fixImagePath(url) {
            if (!url) return 'assets/images/placeholder.jpg';
            if (url.startsWith('/')) return `assets/images/${url.substring(1)}`;
            if (url.includes('assets/images/')) return url;
            return `assets/images/${url}`;
        }

        // Modal cumpleaños
        function mostrarModalCumpleanos(abueloId, nombreAbuelo) {
            Swal.fire({
                title: `🎂 Felicita a ${nombreAbuelo}`,
                html: `
                    <form id="swal-cumpleanos-form">
                        <div class="mb-3 text-start">
                            <label class="form-label">Tu Nombre</label>
                            <input type="text" class="form-control" id="swal-nombre" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label">Tu Email (opcional)</label>
                            <input type="email" class="form-control" id="swal-email">
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label">Mensaje de Felicitación</label>
                            <textarea class="form-control" id="swal-mensaje" rows="4" required></textarea>
                        </div>
                    </form>
                `,
                showCancelButton: true,
                confirmButtonText: 'Enviar Felicitación',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#ffa726',
                preConfirm: async () => {
                    const nombre = document.getElementById('swal-nombre').value;
                    const email = document.getElementById('swal-email').value;
                    const mensaje = document.getElementById('swal-mensaje').value;

                    if (!nombre || !mensaje || mensaje.length < 10) {
                        Swal.showValidationMessage('Por favor completa todos los campos (mensaje mínimo 10 caracteres)');
                        return false;
                    }

                    try {
                        const response = await api.post('cumpleanos', {
                            abuelo_id: abueloId,
                            nombre_remitente: nombre,
                            email_remitente: email,
                            mensaje: mensaje
                        });

                        if (!response.success) {
                            throw new Error(response.message);
                        }

                        return response;
                    } catch (error) {
                        Swal.showValidationMessage(`Error: ${error.message}`);
                        return false;
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    showSuccess('Tu felicitación será entregada después de revisión. 🎂', '¡Mensaje Enviado!');
                }
            });
        }

        // Event listeners
        document.getElementById('filtroEstado').addEventListener('change', aplicarFiltros);
        document.getElementById('filtroCiudad').addEventListener('input', aplicarFiltros);

        // Cargar al inicio
        document.addEventListener('DOMContentLoaded', cargarAbuelos);
    </script>
</body>
</html>
