<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donación Exitosa - Caminemos Juntos Colombia</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            color: white;
            animation: bounceIn 0.8s ease-out;
        }
        
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="success-page">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card shadow-lg">
                        <div class="card-body p-5 text-center">
                            <div class="success-icon">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            
                            <h1 class="mb-4">¡Donación Exitosa!</h1>
                            
                            <p class="lead">
                                Gracias por tu generosidad. Tu donación ha sido procesada correctamente 
                                y pronto llegará a los abuelos que más lo necesitan.
                            </p>

                            <div id="reference-code" class="alert alert-secondary my-4"></div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                <a href="../index.html" class="btn btn-primary btn-lg">
                                    <i class="fas fa-home me-2"></i> Volver al Inicio
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Obtener código de referencia de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        
        if (ref) {
            document.getElementById('reference-code').innerHTML = `
                <strong>Código de referencia:</strong><br>
                <code>${ref}</code>
            `;
        }
    </script>
</body>
</html>
