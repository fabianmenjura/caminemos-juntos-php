<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/placeholder-logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/placeholder-logo.png">
    <link rel="apple-touch-icon" href="assets/images/placeholder-logo.png">
    
    <!-- SEO -->
    <title>Donar a Adultos Mayores en Chiquinquirá | Caminemos Juntos Boyacá</title>
    <meta name="description" content="Tu donación transforma vidas en Chiquinquirá. Ayuda a adultos mayores con $20,000 mensuales. Pago seguro con PayU. ¡Haz la diferencia hoy!">
    <meta name="keywords" content="donar adultos mayores chiquinquirá, donación tercera edad boyacá, ayudar abuelos colombia, adoptar abuelo mensualmente">
    <link rel="canonical" href="https://caminemosjuntos.org/donar.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dona a Adultos Mayores en Chiquinquirá">
    <meta property="og:description" content="Con $20,000 mensuales cambias la vida de un adulto mayor. Pago seguro. ¡Dona ahora!">
    <meta property="og:url" content="https://caminemosjuntos.org/donar.html">
    <meta property="og:image" content="https://caminemosjuntos.org/assets/images/elderly-colombian-woman-happy-flowers.jpg">
    
    <!-- Schema.org - DonateAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DonateAction",
      "recipient": {
        "@type": "NGO",
        "name": "Caminemos Juntos Chiquinquirá"
      },
      "description": "Donación mensual para acompañamiento de adultos mayores en Chiquinquirá",
      "priceSpecification": {
        "@type": "UnitPriceSpecification",
        "price": "20000",
        "priceCurrency": "COP",
        "name": "Donación Mensual Básica"
      }
    }
    </script>
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header fixed-top">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/placeholder-logo.png" 
                         alt="Logo Caminemos Juntos Chiquinquirá" 
                         class="logo"
                         width="40"
                         height="40">
                    <span class="brand-text">Caminemos Juntos</span>
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="abuelos.html">Abuelos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="donar.html">Donar</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#voluntarios">Voluntariado</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-image-container">
            <img src="assets/images/elderly-colombian-woman-cooking-happy.jpg" 
                 alt="Donación para adultos mayores" 
                 class="hero-bg-image">
        </div>
        <div class="hero-overlay"></div>
        <div class="container">
            <div class="row align-items-center" style="min-height: 400px;">
                <div class="col-lg-8 mx-auto text-center">
                    <h1 class="hero-title" data-aos="fade-up">Haz tu Donación</h1>
                    <p class="hero-subtitle" data-aos="fade-up" data-aos-delay="100">
                        Tu donación puede ser el abrazo que un abuelo necesita. Toda contribución cuenta.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <div class="container py-5">

        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <!-- Nav Tabs -->
                        <ul class="nav nav-tabs mb-4" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#personal">
                                    <i class="fas fa-user me-2"></i> Persona Natural
                                </button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#empresa">
                                    <i class="fas fa-building me-2"></i> Empresa
                                </button>
                            </li>
                        </ul>

                        <!-- Tab Content -->
                        <div class="tab-content">
                            <!-- Personal Donation Tab -->
                            <div class="tab-pane fade show active" id="personal">
                                <form id="personal-donation-form">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nombre completo *</label>
                                            <input type="text" class="form-control" name="nombre_completo" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Ciudad *</label>
                                            <input type="text" class="form-control" name="ciudad" required>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Celular *</label>
                                            <input type="tel" class="form-control" name="telefono" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Correo electrónico *</label>
                                            <input type="email" class="form-control" name="email" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Monto (COP) *</label>
                                        <input type="number" class="form-control" name="monto" min="10000" step="1000" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Frecuencia *</label>
                                        <select class="form-select" name="frecuencia" required>
                                            <option value="unica">Donación única</option>
                                            <option value="mensual">Donación mensual</option>
                                            <option value="trimestral">Donación trimestral</option>
                                            <option value="anual">Donación anual</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Método de pago *</label>
                                        <select class="form-select" name="metodo_pago" required>
                                            <option value="tarjeta">PayU Latam (Tarjeta, PSE, Efecty)</option>
                                            <option value="nequi">Nequi</option>
                                            <option value="daviplata">Daviplata</option>
                                            <option value="transferencia">Transferencia bancaria</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Mensaje (opcional)</label>
                                        <textarea class="form-control" name="mensaje" rows="3"></textarea>
                                    </div>
                                    <div class="text-center">
                                        <button type="submit" class="btn btn-primary btn-lg">
                                            <i class="fas fa-heart me-2"></i> Hacer Donación
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Corporate Donation Tab -->
                            <div class="tab-pane fade" id="empresa">
                                <form id="corporate-donation-form">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nombre de la empresa *</label>
                                            <input type="text" class="form-control" name="nombre_empresa" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">NIT *</label>
                                            <input type="text" class="form-control" name="nit" required>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Persona de contacto *</label>
                                            <input type="text" class="form-control" name="nombre_contacto" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Ciudad *</label>
                                            <input type="text" class="form-control" name="ciudad" required>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Teléfono *</label>
                                            <input type="tel" class="form-control" name="telefono" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Correo electrónico *</label>
                                            <input type="email" class="form-control" name="email" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Monto (COP) *</label>
                                        <input type="number" class="form-control" name="monto" min="100000" step="10000" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Frecuencia *</label>
                                        <select class="form-select" name="frecuencia" required>
                                            <option value="mensual">Aporte mensual</option>
                                            <option value="trimestral">Aporte trimestral</option>
                                            <option value="anual">Aporte anual</option>
                                            <option value="unica">Aporte único</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Tipo de patrocinio *</label>
                                        <select class="form-select" name="tipo_patrocinio" required>
                                            <option value="general">Patrocinio general</option>
                                            <option value="especifico">Patrocinio específico</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Método de pago *</label>
                                        <select class="form-select" name="metodo_pago" required>
                                            <option value="tarjeta">PayU Latam (Tarjeta, PSE)</option>
                                            <option value="transferencia">Transferencia bancaria</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="requiere_factura" id="factura">
                                            <label class="form-check-label" for="factura">
                                                Requiero factura electrónica
                                            </label>
                                        </div>
                                    </div>
                                    <div class="text-center">
                                        <button type="submit" class="btn btn-primary btn-lg">
                                            <i class="fas fa-building me-2"></i> Enviar Solicitud
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info mt-4 text-center">
                    <i class="fas fa-info-circle me-2"></i>
                    Todas las donaciones son seguras y recibirás un comprobante por correo electrónico.
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- WhatsApp Button Container -->
    <div id="whatsapp-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/donacion.js"></script>
    <script>
        // Inicializar componentes reutilizables
        initComponents('donar');
    </script>
</body>
</html>
